<!DOCTYPE html>
<html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>إنشاء حساب | FoodLoop</title><link rel="stylesheet" href="styles.css"><script src="app.js" defer></script></head>
<body class="auth-body"><button class="lang-toggle auth-lang" type="button" aria-label="Switch language">EN</button><a class="auth-back" href="index.html">→ العودة للرئيسية</a><main class="auth-layout"><section class="auth-aside"><a class="brand" href="index.html"><img class="brand-logo" src="foodloop-logo.png" alt="FoodLoop logo"><span class="brand-word">Food<span class="green">Loop</span></span></a><div><span class="eyebrow light">انضم إلى مجتمعنا</span><h1>معًا نقلل الهدر<br>ونزيد الفائدة.</h1><p>اختر نوع حسابك لتبدأ رحلتك في إنقاذ الطعام.</p></div><span class="auth-tagline">Good Food • Bigger Impact</span></section><section class="auth-content"><form class="auth-form" id="registerForm"><span class="eyebrow">خطوة أولى نحو الأثر</span><h2>إنشاء حساب</h2><p class="muted">أدخل المعلومات الأساسية للبدء.</p><label for="fullName">الاسم أو اسم الجهة</label><input id="fullName" name="fullName" type="text" placeholder="اكتب الاسم هنا" required minlength="2"><label for="role">نوع الحساب</label><select id="role" name="role" required><option value="">اختر نوع الحساب</option><option value="donor">مطعم أو مخبز أو متجر</option><option value="charity">جمعية خيرية</option><option value="animal">منظمة رعاية حيوان</option><option value="volunteer">متطوع</option></select><label for="regEmail">البريد الإلكتروني</label><input id="regEmail" name="email" type="email" placeholder="name@example.com" required><label for="regPassword">كلمة المرور</label><input id="regPassword" name="password" type="password" placeholder="6 أحرف على الأقل" minlength="6" required><button class="btn btn-primary btn-full" type="submit">إنشاء الحساب</button><p class="form-note" id="registerMessage" role="status"></p><p class="auth-switch">لديك حساب بالفعل؟ <a href="login.html">سجّل الدخول</a></p><p class="demo-note">واجهة تجريبية فقط — لا تُرسل بياناتك إلى خادم.</p></form></section></main></body></html>
